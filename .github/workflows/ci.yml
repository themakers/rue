name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  react-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install React 18 peer matrix
        run: >-
          pnpm add --workspace-root --save-dev --lockfile=false
          react@18.3.1 react-dom@18.3.1 react-test-renderer@18.3.1
          @types/react@18.3.27 @types/react-dom@18.3.7
      - run: pnpm test:web
      - run: pnpm exec tsc -p tsconfig.web.json --noEmit

  react-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install latest React 19 peer matrix
        run: >-
          pnpm add --workspace-root --save-dev --lockfile=false
          react@19.2.8 react-dom@19.2.8 react-test-renderer@19.2.8
          @types/react@19.2.18 @types/react-dom@19.2.4
      - run: pnpm test:web
      - run: pnpm exec tsc -p tsconfig.web.json --noEmit
